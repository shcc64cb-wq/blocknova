
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090811">
<title>مدیریت سرورها | BlockNova</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#090811;color:white;font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:950px;margin:25px auto}
.panel,.server{background:#151322;border:1px solid #30264b;border-radius:15px;padding:18px;margin-bottom:15px}
h2{color:#a78bfa}
.muted{color:#aaa;font-size:13px;line-height:2;overflow-wrap:anywhere}
.server{background:#211a35}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:15px}
.item{background:#090811;padding:12px;border-radius:9px;overflow-wrap:anywhere}
.item small{display:block;color:#aaa;margin-bottom:8px}
.item strong{color:#c4b5fd;font-size:14px}
button,select,input{padding:12px 14px;border:1px solid #514078;border-radius:9px;background:#090811;color:white;font-family:inherit;margin:5px 0;max-width:100%}
button{background:#8b5cf6;border:0;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.delete{background:#b91c1c}
.edit{background:#2563eb}
.editor{display:none;background:#151322;padding:14px;border-radius:10px;margin-top:12px}
.editor label{display:block;color:#c4b5fd;font-size:13px;margin-top:10px}
.editor input,.editor select{width:100%}
.error{color:#fca5a5}
.success{color:#86efac}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
.stat{flex:1;min-width:130px;background:#090811;padding:13px;border-radius:10px;color:#c4b5fd}
.stat strong{display:block;font-size:23px;margin-top:8px}
#search{width:100%;margin:12px 0}
.empty{background:#151322;border-radius:12px;padding:20px;text-align:center;color:#aaa}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">

<div class="panel">
 <h2>BlockNova</h2>
 <p class="muted">
  <a href="blocknova-panel-v2.html" style="color:#a78bfa">بازگشت به پنل</a>
 </p>
 <h2>مدیریت تمام سرورها</h2>
 <p id="message" class="muted">در حال بررسی دسترسی مدیر...</p>
 <button id="refresh" hidden>بروزرسانی سرورها</button>

 <div class="stats" id="statistics" hidden>
  <div class="stat">
   کل سرورها
   <strong id="total">۰</strong>
  </div>
  <div class="stat">
   سرورهای فعال
   <strong id="active">۰</strong>
  </div>
  <div class="stat">
   در انتظار
   <strong id="waiting">۰</strong>
  </div>
  <div class="stat">
   متوقف‌شده
   <strong id="stopped">۰</strong>
  </div>
 </div>
</div>

<div class="panel" id="searchPanel" hidden>
 <h3>جستجوی سرورها</h3>
 <input id="search" type="search" placeholder="نام سرور، ایمیل یا شناسه سرور...">
</div>

<div id="servers"></div>
</div>

<script type="module">
import {createClient} from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase=createClient(
 "https://rxynsocnofdakbjbsgry.supabase.co",
 "sb_publishable_v_-z4rWz91cMaVk6GEG0lg_eMQRaim9"
);

const message=document.getElementById("message");
const box=document.getElementById("servers");
const refresh=document.getElementById("refresh");
const search=document.getElementById("search");
const statistics=document.getElementById("statistics");
const searchPanel=document.getElementById("searchPanel");

let allServers=[];

function fa(value){
 return Number(value||0).toLocaleString("fa-IR");
}

function field(label,value){
 const div=document.createElement("div");
 div.className="item";
 const small=document.createElement("small");
 small.textContent=label;
 const strong=document.createElement("strong");
 strong.textContent=value??"تنظیم نشده";
 div.append(small,strong);
 return div;
}

function makeSelect(values,current){
 const select=document.createElement("select");
 values.forEach(value=>{
  const option=document.createElement("option");
  option.value=value;
  option.textContent=value;
  select.append(option);
 });
 select.value=current;
 return select;
}

function updateStats(){
 document.getElementById("total").textContent=fa(allServers.length);
 document.getElementById("active").textContent=
  fa(allServers.filter(s=>s.server_status==="active").length);
 document.getElementById("waiting").textContent=
  fa(allServers.filter(s=>s.server_status==="waiting").length);
 document.getElementById("stopped").textContent=
  fa(allServers.filter(s=>s.server_status==="stopped").length);
}

async function changeStatus(server,status,button){
 if(!confirm("وضعیت این سرور تغییر کند؟"))return;

 button.disabled=true;
 message.textContent="در حال ذخیره وضعیت جدید...";

 const {data,error}=await supabase.rpc(
  "admin_update_server_status",
  {p_server_id:server.server_id,p_status:status}
 );

 button.disabled=false;

 if(error){
  message.textContent="خطا: "+error.message;
  message.className="muted error";
  return;
 }

 if(data!==true){
  message.textContent="سرور پیدا نشد یا تغییر انجام نشد.";
  message.className="muted error";
  return;
 }

 message.textContent="وضعیت سرور با موفقیت تغییر کرد.";
 message.className="muted success";
 await loadServers();
}

async function deleteServer(server,button){
 if(!confirm("حذف دائمی سرور «"+
  (server.server_name||"بدون نام")+"» انجام شود؟ این کار قابل بازگشت نیست."))return;

 button.disabled=true;
 message.textContent="در حال حذف سرور...";

 const {data,error}=await supabase.rpc(
  "admin_delete_server",
  {p_server_id:server.server_id}
 );

 button.disabled=false;

 if(error){
  message.textContent="خطا در حذف: "+error.message;
  message.className="muted error";
  return;
 }

 if(data!==true){
  message.textContent="سرور پیدا نشد یا حذف انجام نشد.";
  message.className="muted error";
  return;
 }

 message.textContent="سرور حذف شد.";
 message.className="muted success";
 await loadServers();
}

async function editServer(server,editor,button){
 const inputs=editor.querySelectorAll("[data-field]");
 const values={};

 inputs.forEach(input=>{
  values[input.dataset.field]=input.value.trim();
 });

 const ram=Number(values.ram);

 if(!values.name||!values.software||!values.version){
  message.textContent="همه فیلدها را کامل کن.";
  message.className="muted error";
  return;
 }

 if(![2,4,6].includes(ram)){
  message.textContent="مقدار RAM معتبر نیست.";
  message.className="muted error";
  return;
 }

 if(!confirm("تغییرات مشخصات این سرور ذخیره شود؟"))return;

 button.disabled=true;
 message.textContent="در حال ذخیره مشخصات...";

 const {data,error}=await supabase.rpc(
  "admin_edit_server",
  {
   p_server_id:server.server_id,
   p_name:values.name,
   p_type:values.type,
   p_software:values.software,
   p_version:values.version,
   p_ram:ram
  }
 );

 button.disabled=false;

 if(error){
  message.textContent="خطا در ویرایش: "+error.message;
  message.className="muted error";
  return;
 }

 if(data!==true){
  message.textContent="سرور پیدا نشد یا ویرایش انجام نشد.";
  message.className="muted error";
  return;
 }

 message.textContent="مشخصات سرور با موفقیت ویرایش شد.";
 message.className="muted success";
 await loadServers();
}

function showServers(){
 const term=search.value.trim().toLowerCase();
 const filtered=allServers.filter(server=>{
  return [
   server.server_name,
   server.server_id,
   server.user_email
  ].some(value=>String(value||"").toLowerCase().includes(term));
 });

 box.replaceChildren();

 if(filtered.length===0){
  const empty=document.createElement("div");
  empty.className="empty";
  empty.textContent=allServers.length
   ?"سروری با این مشخصات پیدا نشد."
   :"هنوز سروری ثبت نشده است.";
  box.append(empty);
  return;
 }

 filtered.forEach(server=>{
  const card=document.createElement("div");
  card.className="server";

  const title=document.createElement("h3");
  title.textContent=server.server_name||"بدون نام";

  const owner=document.createElement("p");
  owner.className="muted";
  owner.textContent="صاحب سرور: "+(server.user_email||"نامشخص");

  const id=document.createElement("p");
  id.className="muted";
  id.textContent="شناسه سرور: "+(server.server_id||"نامشخص");

  const info=document.createElement("div");
  info.className="info";
  info.append(
   field("نوع سرور",server.server_type),
   field("نرم‌افزار",server.server_software),
   field("نسخه بازی",server.server_version),
   field("حافظه RAM",server.ram_gb?server.ram_gb+" گیگابایت":"تنظیم نشده"),
   field("وضعیت",server.server_status)
  );

  const statusLabel=document.createElement("p");
  statusLabel.className="muted";
  statusLabel.textContent="تغییر وضعیت:";

  const statusSelect=makeSelect(
   ["waiting","active","stopped"],
   server.server_status||"waiting"
  );

  const saveStatus=document.createElement("button");
  saveStatus.textContent="ذخیره وضعیت";
  saveStatus.addEventListener("click",()=>{
   changeStatus(server,statusSelect.value,saveStatus);
  });

  const editButton=document.createElement("button");
  editButton.className="edit";
  editButton.textContent="ویرایش مشخصات";

  const editor=document.createElement("div");
  editor.className="editor";

  function addInput(labelText,key,value){
   const label=document.createElement("label");
   label.textContent=labelText;
   const input=document.createElement("input");
   input.dataset.field=key;
   input.value=value??"";
   editor.append(label,input);
  }

  addInput("نام سرور","name",server.server_name);

  const typeLabel=document.createElement("label");
  typeLabel.textContent="نوع سرور";
  const typeSelect=makeSelect(
   ["Java","Bedrock"],server.server_type||"Java"
  );
  typeSelect.dataset.field="type";
  editor.append(typeLabel,typeSelect);

  addInput("نرم‌افزار","software",server.server_software);
  addInput("نسخه بازی","version",server.server_version);

  const ramLabel=document.createElement("label");
  ramLabel.textContent="حافظه RAM";
  const ramSelect=makeSelect(
   ["2","4","6"],String(server.ram_gb||2)
  );
  ramSelect.dataset.field="ram";
  editor.append(ramLabel,ramSelect);

  const saveEdit=document.createElement("button");
  saveEdit.textContent="ذخیره ویرایش";
  saveEdit.addEventListener("click",()=>{
   editServer(server,editor,saveEdit);
  });

  editor.append(saveEdit);

  editButton.addEventListener("click",()=>{
   editor.style.display=
    editor.style.display==="block"?"none":"block";
  });

  const remove=document.createElement("button");
  remove.className="delete";
  remove.textContent="حذف سرور";
  remove.addEventListener("click",()=>{
   deleteServer(server,remove);
  });

  const actions=document.createElement("div");
  actions.className="actions";
  actions.append(statusSelect,saveStatus,editButton,remove);

  card.append(title,owner,id,info,statusLabel,actions,editor);
  box.append(card);
 });
}

async function loadServers(){
 refresh.disabled=true;
 box.replaceChildren();
 message.textContent="در حال دریافت سرورها...";

 const {data,error}=await supabase.rpc("admin_list_servers");

 refresh.disabled=false;

 if(error){
  message.textContent="خطا در دریافت سرورها: "+error.message;
  message.className="muted error";
  return;
 }

 if(!Array.isArray(data)){
  message.textContent="اطلاعات دریافتی معتبر نیست.";
  message.className="muted error";
  return;
 }

 allServers=data;
 statistics.hidden=false;
 searchPanel.hidden=false;
 updateStats();

 message.textContent="سرورها با موفقیت دریافت شدند. تعداد: "+fa(data.length);
 message.className="muted success";

 showServers();
}

async function start(){
 const {data:{session},error}=await supabase.auth.getSession();

 if(error||!session){
  location.href="login.html";
  return;
 }

 const {data:admin,error:adminError}=await supabase
  .from("admins")
  .select("user_id")
  .eq("user_id",session.user.id)
  .maybeSingle();

 if(adminError||!admin){
  message.textContent="دسترسی غیرمجاز؛ این حساب مدیر نیست.";
  message.className="muted error";
  return;
 }

 message.textContent="دسترسی مدیر تأیید شد.";
 message.className="muted success";
 refresh.hidden=false;
 await loadServers();
}

refresh.addEventListener("click",loadServers);
search.addEventListener("input",showServers);

start();
</script>
</body>
</html>
