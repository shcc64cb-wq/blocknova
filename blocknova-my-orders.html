
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlockNova | سفارش‌های من</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090811;color:#f5f3ff;
 font-family:Tahoma,Arial,sans-serif;
 background-image:radial-gradient(circle at 85% 0,#28164c,transparent 38%);
}
header{
 padding:22px 18px;border-bottom:1px solid #302943;
 display:flex;justify-content:space-between;align-items:center;
 flex-wrap:wrap;gap:12px
}
.brand{font-size:24px;font-weight:900;direction:ltr}
.brand span{color:#a78bfa}
.back{
 color:white;text-decoration:none;background:#29233c;
 padding:11px 15px;border-radius:10px;font-size:13px
}
.wrap{max-width:850px;margin:auto;padding:30px 16px}
h1{font-size:23px}
.sub{color:#aaa3bd;font-size:13px;line-height:2}
.order{
 background:linear-gradient(145deg,#211a35,#151322);
 border:1px solid #39304e;border-radius:16px;
 padding:18px;margin-top:14px
}
.order-head{
 display:flex;justify-content:space-between;
 align-items:center;gap:10px;flex-wrap:wrap
}
.name{font-weight:bold;font-size:17px}
.status{
 background:#493716;color:#fbbf24;
 border-radius:20px;padding:7px 11px;font-size:11px
}
.status.paid{background:#143d2b;color:#86efac}
.status.failed{background:#54212b;color:#fecaca}
.details{
 color:#c4bdd2;font-size:12px;line-height:2.5;
 margin-top:12px;white-space:pre-line
}
.price{color:#c4b5fd;font-weight:bold}
.empty{
 text-align:center;padding:35px 15px;
 color:#aaa3bd;border:1px dashed #493c65;
 border-radius:15px;margin-top:20px;line-height:2
}
.error{color:#fca5a5}
button{
 border:0;border-radius:11px;padding:12px 16px;
 background:#29233c;color:white;font-weight:bold;
 cursor:pointer;margin-top:18px
}
button:disabled{opacity:.5}
footer{text-align:center;color:#766f89;font-size:11px;margin-top:35px}
</style>
</head>

<body>

<header>
 <div class="brand">Block<span>Nova</span></div>
 <a class="back" href="blocknova-panel-v2.html">بازگشت به پنل</a>
</header>

<main class="wrap">
 <h1>سفارش‌های من</h1>
 <div class="sub">تمام سفارش‌هایی که با حساب کاربری خود ثبت کرده‌ای.</div>

 <div id="orders" class="empty">در حال دریافت سفارش‌ها...</div>

 <button id="refreshButton" onclick="loadOrders()">
  بروزرسانی سفارش‌ها
 </button>

 <footer>© BlockNova</footer>
</main>

<script type="module">
import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase=createClient(
 "https://rxynsocnofdakbjbsgry.supabase.co",
 "sb_publishable_v_-z4rWz91cMaVk6GEG0lg_eMQRaim9"
);

const ordersElement=document.getElementById("orders");
const refreshButton=document.getElementById("refreshButton");

function faNumber(value){
 return Number(value).toLocaleString("fa-IR");
}

function showEmpty(message,isError=false){
 ordersElement.className="empty"+(isError?" error":"");
 ordersElement.textContent=message;
}

function statusInfo(status){
 if(status==="paid") return ["پرداخت شده","paid"];
 if(status==="failed") return ["ناموفق","failed"];
 if(status==="cancelled") return ["لغو شده","failed"];
 return ["در انتظار پرداخت",""];
}

async function loadOrders(){
 refreshButton.disabled=true;
 showEmpty("در حال دریافت سفارش‌ها...");

 try{
  const {data:sessionData,error:sessionError}=
   await supabase.auth.getSession();

  if(sessionError) throw sessionError;

  const user=sessionData.session?.user;

  if(!user){
   location.href="login.html";
   return;
  }

  const {data,error}=await supabase
   .from("orders")
   .select("*")
   .eq("user_id",user.id)
   .order("created_at",{ascending:false});

  if(error) throw error;

  ordersElement.replaceChildren();

  if(!data || data.length===0){
   showEmpty("هنوز هیچ سفارشی ثبت نکرده‌ای.");
   return;
  }

  ordersElement.className="";

  data.forEach(order=>{
   const card=document.createElement("div");
   card.className="order";

   const head=document.createElement("div");
   head.className="order-head";

   const name=document.createElement("div");
   name.className="name";
   name.textContent="اشتراک "+order.plan_name;

   const status=document.createElement("span");
   const info=statusInfo(order.status);
   status.className="status "+info[1];
   status.textContent=info[0];

   head.append(name,status);

   const details=document.createElement("div");
   details.className="details";

   const date=new Date(order.created_at);
   const dateText=isNaN(date.getTime())
    ?"نامشخص"
    :date.toLocaleString("fa-IR");

   details.textContent=
    "شماره سفارش: "+String(order.id).slice(0,8)+
    "\nقیمت: "+faNumber(order.price_toman)+" تومان"+
    "\nمدت اشتراک: "+faNumber(order.duration_days)+" روز"+
    "\nتاریخ ثبت: "+dateText;

   card.append(head,details);
   ordersElement.appendChild(card);
  });

 }catch(error){
  showEmpty("خطا در دریافت سفارش‌ها: "+error.message,true);
 }finally{
  refreshButton.disabled=false;
 }
}

window.loadOrders=loadOrders;

loadOrders();
</script>

</body>
</html>
