
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود | BlockNova</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#090712;color:white;
 font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px
}
.card{
 width:100%;max-width:390px;background:#171326;
 border:1px solid #7139b5;border-radius:18px;padding:28px
}
h1{text-align:center;color:#b77aff}
p{text-align:center;color:#bbb}
input,button{
 width:100%;padding:14px;margin-top:13px;
 border-radius:9px;font-size:15px
}
input{
 background:#0c0915;border:1px solid #55416e;color:white;
 text-align:start;
}
button{
 background:#8b42d6;color:white;border:0;font-weight:bold;
 cursor:pointer
}
button.secondary{background:#302344}
button:disabled{opacity:.5;cursor:not-allowed}
#message{font-size:14px;line-height:1.8;overflow-wrap:anywhere}
</style>
</head>

<body>

<div class="card">

<h1>BlockNova</h1>
<p id="subtitle">ورود یا ساخت حساب کاربری</p>

<input id="email" type="email" placeholder="ایمیل" autocomplete="email">
<input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password">

<button id="register">ساخت حساب</button>
<button id="login" class="secondary">ورود به حساب</button>
<button id="logout" class="secondary" hidden>خروج از حساب</button>

<p id="message">به BlockNova خوش آمدی</p>

</div>

<!-- زبان مشترک تمام صفحات -->
<script src="language.js"></script>

<script type="module">
import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://rxynsocnofdakbjbsgry.supabase.co";
const SUPABASE_KEY = "sb_publishable_v_-z4rWz91cMaVk6GEG0lg_eMQRaim9";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const email = document.getElementById("email");
const password = document.getElementById("password");
const message = document.getElementById("message");
const register = document.getElementById("register");
const login = document.getElementById("login");
const logout = document.getElementById("logout");

const panelURL =
"https://shcc64cb-wq.github.io/blocknova/blocknova-panel-v2.html";

function currentLanguage() {
 return localStorage.getItem("blocknova-language") || "fa";
}

const translations = {
 fa: {
  registering: "در حال ساخت حساب...",
  loggingIn: "در حال ورود...",
  accountCreated: "حساب ساخته شد؛ در حال انتقال...",
  confirmEmail: "حساب ساخته شد! ایمیلت را بررسی کن و لینک تأیید را بزن.",
  loginSuccess: "ورود موفق بود؛ در حال انتقال...",
  loggedOut: "از حساب خارج شدی.",
  error: "خطا: ",
  logoutError: "خطا در خروج: ",
  invalidLogin: "ایمیل یا رمز عبور اشتباه است.",
  invalidEmail: "ایمیل واردشده معتبر نیست.",
  weakPassword: "رمز عبور ضعیف است. یک رمز قوی‌تر انتخاب کن.",
  alreadyRegistered: "این ایمیل قبلاً ثبت‌نام کرده است.",
  emailNotConfirmed: "ایمیلت هنوز تأیید نشده است. ایمیلت را بررسی کن.",
  tooManyRequests: "تعداد درخواست‌ها زیاد است. کمی بعد دوباره تلاش کن."
 },
 en: {
  registering: "Creating your account...",
  loggingIn: "Logging in...",
  accountCreated: "Account created; redirecting...",
  confirmEmail: "Account created! Check your email and click the confirmation link.",
  loginSuccess: "Login successful; redirecting...",
  loggedOut: "You have logged out.",
  error: "Error: ",
  logoutError: "Logout error: ",
  invalidLogin: "Incorrect email or password.",
  invalidEmail: "The email address is invalid.",
  weakPassword: "Your password is too weak. Choose a stronger password.",
  alreadyRegistered: "This email is already registered.",
  emailNotConfirmed: "Your email is not confirmed yet. Please check your inbox.",
  tooManyRequests: "Too many requests. Please try again later."
 }
};

function t(key) {
 const lang = currentLanguage();
 return translations[lang]?.[key] || translations.fa[key] || key;
}

function setMessage(key) {
 message.textContent = t(key);
}

function getErrorMessage(error) {
 const text = (error.message || "").toLowerCase();

 if (
  text.includes("invalid login credentials") ||
  text.includes("invalid credentials")
 ) return t("invalidLogin");

 if (text.includes("invalid email")) {
  return t("invalidEmail");
 }

 if (
  text.includes("password") &&
  (text.includes("weak") || text.includes("at least"))
 ) return t("weakPassword");

 if (
  text.includes("already registered") ||
  text.includes("user already exists")
 ) return t("alreadyRegistered");

 if (
  text.includes("email not confirmed") ||
  text.includes("email_not_confirmed")
 ) return t("emailNotConfirmed");

 if (
  text.includes("rate limit") ||
  text.includes("too many requests")
 ) return t("tooManyRequests");

 return t("error") + error.message;
}

function setLoading(value) {
 register.disabled = value;
 login.disabled = value;
}

register.onclick = async () => {
 try {
  setLoading(true);
  setMessage("registering");

  const {data, error} = await supabase.auth.signUp({
   email: email.value.trim(),
   password: password.value,
   options: {
    emailRedirectTo: panelURL
   }
  });

  if (error) throw error;

  if (data.session) {
   setMessage("accountCreated");
   window.location.href = panelURL;
  } else {
   setMessage("confirmEmail");
   setLoading(false);
  }

 } catch(error) {
  message.textContent = getErrorMessage(error);
  setLoading(false);
 }
};

login.onclick = async () => {
 try {
  setLoading(true);
  setMessage("loggingIn");

  const {data, error} = await supabase.auth.signInWithPassword({
   email: email.value.trim(),
   password: password.value
  });

  if (error) throw error;

  if (data.session) {
   setMessage("loginSuccess");
   window.location.href = panelURL;
  }

 } catch(error) {
  message.textContent = getErrorMessage(error);
  setLoading(false);
 }
};

logout.onclick = async () => {
 const {error} = await supabase.auth.signOut();

 if (error) {
  message.textContent = t("logoutError") + error.message;
 } else {
  setMessage("loggedOut");
  logout.hidden = true;
 }
};

supabase.auth.onAuthStateChange((event, session) => {
 logout.hidden = !session;
});

</script>

</body>
</html>
