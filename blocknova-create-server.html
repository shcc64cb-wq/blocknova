
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ساخت سرور | BlockNova</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#090811;color:white;font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:650px;margin:25px auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:25px;font-weight:bold;color:#a78bfa}
.panel{background:#171426;border:1px solid #30264a;border-radius:18px;padding:22px;margin-top:25px}
h1{font-size:23px}
p{color:#c4bfd3;line-height:2}
label{display:block;margin:18px 0 8px;color:#ddd}
input,select{width:100%;padding:14px;background:#211a35;border:1px solid #493866;border-radius:10px;color:white;font-size:15px}
button,a{display:inline-block;border:0;border-radius:10px;padding:13px 18px;background:#8b5cf6;color:white;text-decoration:none;font-weight:bold;cursor:pointer}
button{width:100%;margin-top:22px;font-size:16px}
button:disabled{opacity:.5}
.secondary{background:#30264a;padding:11px}
.note{background:#2b2140;border:1px solid #594080;border-radius:12px;padding:13px;margin-top:18px;color:#ddd;line-height:2}
#message{margin-top:15px;color:#c4b5fd;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="logo">✦ BlockNova</div>
<a class="secondary" href="blocknova-panel-v2.html">بازگشت به پنل</a>
</header>

<div class="panel">
<h1>＋ ساخت سرور جدید</h1>
<p>مشخصات سرور Minecraft خودت رو انتخاب کن.</p>

<form id="serverForm">
<label for="serverName">نام سرور</label>
<input id="serverName" maxlength="40" placeholder="مثلاً My Minecraft Server" required>

<label for="type">نوع سرور</label>
<select id="type">
<option value="Java">Minecraft Java</option>
<option value="Bedrock">Minecraft Bedrock</option>
</select>

<label for="software">نرم‌افزار سرور</label>
<select id="software">
<option value="Paper">Paper</option>
<option value="Spigot">Spigot</option>
<option value="Fabric">Fabric</option>
<option value="Vanilla">Vanilla</option>
</select>

<label for="version">نسخه Minecraft</label>
<select id="version">
<option value="1.21.1">1.21.1</option>
<option value="1.21">1.21</option>
<option value="1.20.4">1.20.4</option>
<option value="1.20.1">1.20.1</option>
<option value="1.19.4">1.19.4</option>
</select>

<div class="note">
توجه: این مرحله فقط مشخصات سرور رو در حساب شما ذخیره می‌کنه. برای اجرای واقعی سرور، زیرساخت میزبانی لازم داریم.
</div>

<button id="submitButton" type="submit">ساخت سرور آزمایشی</button>
<div id="message" role="status"></div>
</form>
</div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
 "https://rxynsocnofdakbjbsgry.supabase.co",
 "sb_publishable_v_-z4rWz91cMaVk6GEG0lg_eMQRaim9"
);

const form = document.getElementById("serverForm");
const message = document.getElementById("message");
const button = document.getElementById("submitButton");
const typeSelect = document.getElementById("type");
const softwareSelect = document.getElementById("software");

function updateSoftwareOptions(){
 const isJava = typeSelect.value === "Java";
 const options = isJava
  ? ["Paper","Spigot","Fabric","Vanilla"]
  : ["Bedrock","PocketMine","Nukkit"];

 softwareSelect.innerHTML = "";
 options.forEach(name=>{
  const option = document.createElement("option");
  option.value = name;
  option.textContent = name;
  softwareSelect.appendChild(option);
 });
}

typeSelect.addEventListener("change",updateSoftwareOptions);

form.addEventListener("submit",async(event)=>{
 event.preventDefault();
 button.disabled = true;
 message.textContent = "در حال ذخیره اطلاعات سرور...";

 try{
  const {data:{session},error:sessionError}=await supabase.auth.getSession();
  if(sessionError) throw sessionError;

  if(!session){
   location.href="login.html";
   return;
  }

  const server={
   user_id:session.user.id,
   name:document.getElementById("serverName").value.trim(),
   type:typeSelect.value,
   software:softwareSelect.value,
   version:document.getElementById("version").value,
   status:"waiting"
  };

  if(!server.name) throw new Error("نام سرور را وارد کنید.");

  const {error}=await supabase.from("servers").insert(server);
  if(error) throw error;

  message.textContent="سرور آزمایشی با موفقیت ذخیره شد! در حال بازگشت به پنل...";
  setTimeout(()=>{
   location.href="blocknova-panel-v2.html";
  },1500);

 }catch(error){
  message.textContent="خطا: "+error.message;
  button.disabled=false;
 }
});
</script>
</body>
</html>
